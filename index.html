<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Best-effort: ask browsers to revalidate this HTML rather than serve a
         stale copy. After a redeploy the hashed JS in dist/assets changes, so a
         cached index.html points at a now-404'd bundle and the app renders a
         black screen (seen on mobile). The hashed assets are immutable and stay
         cacheable; only this document must not go stale. http-equiv cache hints
         are increasingly ignored for the navigation document, so this is a
         mitigation, not a guarantee. -->
    <meta http-equiv="Cache-Control" content="no-cache, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <title>PoE 2 Skill Tree Planner | Built for Mobile</title>
    <meta name="description" content="Create and share your Path of Exile 2 builds with a free passive skill tree planner for mobile and desktop. No account needed." />
    <link rel="canonical" href="https://poe2planner.app/" />
    <meta name="robots" content="index, follow" />

    <link rel="preload" href="%BASE_URL%fonts/OptimusPrincepsSemiBold.ttf" as="font" type="font/ttf" crossorigin />

    <!-- Cinzel: carved-stone display face for the runic UI titles (tooltip
         header, attribution). Body text stays on the system stack. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&display=swap" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#141a24" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="PoE 2 Skill Tree Planner | Built for Mobile" />
    <meta property="og:description" content="Create and share your Path of Exile 2 builds with a free passive skill tree planner for mobile and desktop. No account needed." />
    <meta property="og:url" content="https://poe2planner.app/" />
    <meta property="og:image" content="https://poe2planner.app/social-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="PoE 2 Planner — Forge your own path. A gold and teal gem emblem beside an illuminated passive skill tree. Free for mobile and desktop." />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="PoE 2 Planner" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PoE 2 Skill Tree Planner | Built for Mobile" />
    <meta name="twitter:description" content="Create and share your Path of Exile 2 builds with a free passive skill tree planner for mobile and desktop. No account needed." />
    <meta name="twitter:image" content="https://poe2planner.app/social-preview.png" />
    <meta name="twitter:image:alt" content="PoE 2 Planner — Forge your own path. A gold and teal gem emblem beside an illuminated passive skill tree. Free for mobile and desktop." />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "PoE 2 Skill Tree",
      "url": "https://poe2planner.app/",
      "description": "Create and share your Path of Exile 2 builds with a free passive skill tree planner for mobile and desktop. No account needed.",
      "applicationCategory": "GameApplication",
      "operatingSystem": "Web",
      "browserRequirements": "Requires JavaScript and a modern browser with WebGL support.",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "license": "https://opensource.org/licenses/MIT",
      "author": { "@type": "Person", "name": "cvenzin", "url": "https://github.com/cvenzin" }
    }
    </script>
  </head>
  <body>
    <div id="root">
      <noscript>
        <main style="max-width: 720px; margin: 4em auto; padding: 0 1.5em; font-family: system-ui, sans-serif; color: #ddd;">
          <h1>PoE 2 Skill Tree</h1>
          <p>
            Create and share your Path of Exile 2 builds with a free passive
            skill tree planner for mobile and desktop. No account needed.
          </p>
          <p>
            <a href="%BASE_URL%guides/export-to-poe2/">How to export your passive tree to PoE 2</a>
          </p>
          <p>
            JavaScript is required to render the interactive tree. Enable
            JavaScript or visit the
            <a href="https://github.com/cvenzin/poe2-skilltree">source on GitHub</a>
            for screenshots and project details.
          </p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
